# Pasqal add-on: the Pasqal Python environment on all Slurm nodes, a /home shared by
# the login and compute nodes, and a local Warden with a simulated QPU
#   docker compose -f compose.yml -f compose.pasqal.yml up -d
# qrmi_hres.lua and /etc/slurm/qrmi_config.json: see README.md
x-pasqal: &pasqal
  image: localhost/slurm-pasqal:0.26.4-hres

services:
  slurmdbd:
    <<: *pasqal
    build:
      context: .
      dockerfile: Dockerfile.pasqal
      args:
        SLURM_IMAGE: slurm-docker-cluster:${IMAGE_TAG}
  slurmctld: *pasqal
  c1:
    <<: *pasqal
    volumes:
      - home:/home
  # c2 and the login node start after c1, which copies /home into the new volume first
  c2:
    <<: *pasqal
    volumes:
      - home:/home
    depends_on:
      - c1
  slurm-login:
    <<: *pasqal
    volumes:
      - home:/home
    depends_on:
      - c1
  warden:
    image: localhost/sc26-warden:0.3.2
    hostname: warden
    container_name: warden
    init: true
    stop_grace_period: 30s
    volumes:
      # Pasqal Local authenticates users to Warden with the cluster's MUNGE key;
      # slurmdbd creates the volume first, so the key comes from the Slurm image
      - etc_munge:/etc/munge
      - warden-state:/var/lib/warden
      # qrmi_hres.lua opens and revokes sessions on slurmctld as SlurmUser (990)
      - ./warden-config.yaml:/opt/warden/config.yaml:ro
    depends_on:
      - slurmdbd
    networks:
      - slurm-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4207/accessible"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  # On first mount, /home from the image (user's initial files and ownership) is copied into it
  home:
  warden-state:
