# Slurm-web RBAC policy (mounted at /etc/slurm-web/policy.ini on the agent).
# It replaces the vendor policy. Authentication is disabled in gateway.ini, so every
# visitor is "anonymous": give it all the read-only views of this local test cluster.

[roles]
anonymous
user=ALL

[anonymous]
actions=stats-view,jobs-view,jobs-view-past,nodes-view,partitions-view,qos-view,accounts-view,associations-view,reservations-view,cache-view

[user]
actions=stats-view,jobs-view,jobs-view-past,nodes-view,partitions-view,qos-view,accounts-view,associations-view,reservations-view,cache-view,cache-reset
