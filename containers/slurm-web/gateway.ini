# Slurm-web gateway configuration (mounted at /etc/slurm-web/gateway.ini)
# Reference: https://docs.rackslab.io/slurm-web/conf/conf/gateway.html

[ui]
# Must match the URL typed in the browser (scheme, host and port)
host=http://localhost:5011

[agents]
url=http://slurm-web-agent:5012

# User authentication (LDAP or OIDC) is disabled by default: everyone gets the
# "anonymous" role defined in policy.ini.
#[authentication]
#enabled=yes
