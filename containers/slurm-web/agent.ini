# Slurm-web agent configuration (mounted at /etc/slurm-web/agent.ini)
# Reference: https://docs.rackslab.io/slurm-web/conf/conf/agent.html

[service]
# Same as ClusterName in slurm.conf
cluster=linux

[slurmrestd]
uri=http://slurmrestd:6820
# Defaults, shown for reference:
#   auth=jwt, jwt_mode=auto (the agent signs short-lived tokens itself),
#   jwt_user=slurm, jwt_key=/var/lib/slurm-web/slurmrestd.key (copied by slurm-web-init)

[racksdb]
# No RacksDB rack/datacenter description for this cluster
enabled=no
